; The story text for the vampire campaign of Tiepair (a DRAFT, for you to edit). Edit freely: this is a plain text
; file that gets embedded into the game when you rebuild.
;
; Format:   key=text        (one line per entry; keep each line short enough to
;                           read in a moment on screen)
; Numbered keys (intro.1, intro.2, ...) are shown one after another; leave a
; number out and the lines after it will be ignored, so keep them in order.
; Use plain straight quotes and "--" for dashes (no curly quotes), so every font
; can show them.
;
; taunt1 / taunt2 / taunt3 are what the vampire says after your 1st, 2nd, and
; 3rd-or-later lost hand in a row (a win starts the count again); the worse you
; do, the more it gloats.
; hit1 .. hit4 are what he says after your 1st .. 4th win against him. The 5th
; win is the fatal blow (strike, then defeat).
; trick.N is what he says, right after he introduces himself, about the trick he
; plays in the middle of a hand: Lucien bites cards, Carmilla chains them, Alaric
; eats from the stock. (Keep numbers out of these lines: they can change.)

; [trophies]: for each trophy, <key>.name is its name, <key>.how is how it is earned
; (shown until you have it) and <key>.line is what it says about itself (shown once you
; have it). Keys: firstwin, perfect, jack, queen, king, flawless. The first, second and
; last are for any player, so keep them free of he/she.

; [style]: for every card back, table cloth and moon, <kind>.<key>.name and
; <kind>.<key>.line (kinds: back, cloth, moon). Keep numbers (prices) out of them.

; [relics]: for each relic, <key>.name and <key>.line (what it does). Keys: garlic, pick,
; spoon, locket, moonstone. Keep numbers out of the lines.

; In the lines marked (%d), each %d is replaced by a number when shown, in
; order. Keep the same number of %d, or the line is shown as written.

[campaign]
title=The Court of Seven Steps
premise.1=They said the house on the hill was empty now. Morning had come to it once, and the story went that it would not come again.
premise.2=It was only half the truth. Death is a small thing to a vampire, and a bruised pride is a very large one. Lucien, Carmilla and Alaric, ended but never quite gone, found one another in the dust. And a voice came out of the dark: "Take it down, mortal. It is the only thing we still fear."
premise.3=They could not use the old cards. Those had been won, and a won card is a dead card. So they made another set: ivory and obsidian again, cut in the cellar and cursed by candlelight, and this time for a game they thought you did not know.
premise.4=A pyramid, seven rows deep, with every card lying on two others. Take them in pairs that make thirteen, or take a King alone, and the whole thing comes down. They built the house around it: seven steps up, and a vampire on each of the last three.
premise.5=You were only passing through, again. And know what a lost hand costs. The vampire drinks, a little at a time -- but never the last of you, and the next hand is always yours to deal.
; shown when a hand is lost (before the vampire speaks)
lost.stuck=No pair remains. The hand is dead, and the vampire leans in to drink.
lost.conceded=You throw down your cards and push back from the table. A slow smile, and the vampire takes what is owed.
; (%d) the coins the next win pays now, after the lost hands since your last win
spoils.now=The next win will now pay %d coins.
; (%d %d %d) coins, undo cards, hint cards won for the kill
spoils.paid=Spoils: +%d coins, +%d undo card, +%d hint cards.
; (%d %d %d %d) which win this was, how many it takes, coins and hint cards won
hit.paid=Hit %d of %d. Spoils: +%d coins, +%d hint card.

[jack]
name=Lucien Vale
title=The Knave of Midnight
intro.1=You! The guest who broke my heart. Well, my everything. Do sit. I made this table myself, and I am rather proud of it.
intro.2=I am Lucien Vale, still. Do try not to bleed on the cards.
trick.1=A word on the cards, since the game is new. The ones marked with a bat, I have bitten. Take one away, and I shall have a little from your purse -- and your streak with it.
taunt1.1=Mm. A light vintage, but promising. Go on, deal again. I'll wait. I am very good at waiting. I have had practice.
taunt2.1=Dear me. Thinner than last time. Is this how the living play? No wonder you die so young.
taunt3.1=Please, stop. I can't bear another of your hands -- and you are running dry. My fangs are going numb.
hit1.1=Ha! A lucky pair. Don't let it go to your head. Mine is quite empty already.
hit2.1=Twice? Well... do deal again. I was not watching closely.
hit3.1=Three. Oh, this is no longer amusing. Is that a tremor in my hand?
hit4.1=One more and I -- no. No. Deal. Deal the cards.
strike.1=The last pair comes away. Lucien's smile slips, just a little, for the second time.
defeat.1=Well. That is... unprecedented. Twice! I was only warming up, both times.
defeat.2=Go on, then. The Lady is waiting on the next steps. She is much worse than I am, and she does not play fair. I do. Mostly.

[queen]
name=Lady Carmilla Nox
title=The Pale Lady
intro.1=So Lucien has fallen again. I told him he was too fond of himself. I told him in the cellar, over the knives.
intro.2=I am Carmilla Nox. I have watched a thousand hands played in this house, and I have been beaten in exactly one.
trick.1=Some of these cards I have chained, darling. A chained card will not stir while its neighbour in the row still lies on the table. Clear the cards beside it -- or find a sharper way.
taunt1.1=A near thing. You almost impressed me. "Almost" is such a lovely word, and you taste of it.
taunt2.1=You tire. I can taste it. Rest, if you like. I have all night. I have all of them.
taunt3.1=You keep coming back, and you keep coming back thinner. How tiresome. How... admirable.
hit1.1=A pretty pair. I applaud it, as one applauds a candle before the wind takes it.
hit2.1=Again. You have my attention, mortal. That is not always a gift.
hit3.1=Three pairs. Something in me has begun to count. I dislike it.
hit4.1=Enough. ...No. Go on. One more, and let us see what you are.
strike.1=The final pair settles. The Lady closes her eyes, and for once she is not smiling.
defeat.1=Impossible. I counted every card. I built this game to be counted.
defeat.2=Go up. The Count waits at the top of the seven steps. He has not lost in four hundred years. Well. Not until you.

[king]
name=Count Alaric Dravenmoor
title=The Hollow King
intro.1=Four hundred years, and a drawer. I sat in a drawer for a year, mortal. Do you know what I thought about? Pairs.
intro.2=I am Alaric Dravenmoor. I did not expect to lose the first time. I no longer expect anything.
trick.1=I am hungry, mortal. I am always hungry. Every few times you reach for the stock, I shall take a card from the bottom of it.
taunt1.1=Hm. Not today, then. The cards are patient. So am I.
taunt2.1=Each failure teaches, and each costs you a little warmth. You are learning. I find I am almost... interested.
taunt3.1=Persistence. I remember what that felt like, when I still had blood to be persistent with.
hit1.1=A pair. Hm. Even the tide reaches the shore once.
hit2.1=Two. I remember when I would have laughed.
hit3.1=Three. The crown grows heavy. How curious.
hit4.1=Four. Come, then. Finish what you have started, or I shall finish you.
strike.1=A hush falls over the seven steps. The Count's crown tilts, and stays tilted.
defeat.1=Well played. Twice, now. It has been so long since anyone could even once.
defeat.2=Take the house, mortal. It is only steps and dust. The cards, at least, are very good. I should keep them in a drawer.

[finale]
finale.1=The seven steps fall quiet. One by one, the candles gutter and go out.
finale.2=Morning comes to the house on the hill for the second time. It looks, this once, as if it might stay.
finale.3=On the table the cards lie still: ivory and obsidian, and nothing more. Whatever was in them has gone out with the candles.
caption=I can't believe you won. Twice.

; Fenwick Grimm keeps the Store. intro.N is shown (one line per tap) the first
; time the player visits; greet.N, bought.N and broke.N are picked in turn.
; pitch.* is what he says about a good when the player taps it.
[fenwick]
name=Fenwick Grimm
title=The Grey Peddler
intro.1=Evening again. Fenwick Grimm. They let me back in. Somebody has to keep the honest ledger.
intro.2=Prices are fixed. No haggling, no dice, no luck. I sell goods, friend, not hope.
intro.3=Come and see me between hands. I don't sell to anyone who is holding cards.
greet.1=Back again? Good. Coin talks. Let's hear what yours says.
greet.2=Mind the shelves. Everything on them is honestly priced.
greet.3=Welcome back. Fair prices and no questions, as ever.
bought.1=Pleasure doing business.
bought.2=Sold. A fair price for a fair card.
bought.3=There you go. Handle with care.
broke.1=Short? Come back with more coin. I don't do credit and I don't do luck.
broke.2=That is more than you're carrying, friend. Win a hand or two, then we'll talk.
locked.easyrule=Not in stock yet, friend. Lucien plays kindly enough that nobody needs it. Come back when you've beaten him.
locked.extraturn=Not in stock yet, friend. Lucien lets you go through the stock three times. Ask me again when he's gone.
closed.1=Not once you've taken a card, friend. Finish this hand, or deal a fresh one, and then we'll talk.
leave.1=Mind the moon.
pitch.extraturn=One more trip through the stock. Time is the one thing I can honestly sell twice.
pitch.easyrule=Lets a card go with the one sitting on it. Neighbourly, I call that.
pitch.dawn=First light in a bottle. Makes any vampire behave like Lucien on a good day.
pitch.wild=Any two cards, any ranks, and they go as a pair. Like me, it fits anywhere.
pitch.seer=The next three cards of the stock, face up. Knowing costs extra.
pitch.stake=Seasoned ash. Breaks a chain, spares a bite. Mind where you point it.
pitch.undo=Take back your last move. I won't tell a soul.
pitch.hint=A little nudge toward a pair. Free? Ha. Never.

; The trophies on the shelf in the side panel.
[trophies]
firstwin.name=The First Coin
firstwin.how=Win your first hand.
firstwin.line=The first coin the table ever paid you. It is still warm, and it is not entirely clear from what.
perfect.name=The Steady Hand
perfect.how=Win a hand without a single missed move.
perfect.line=A small silver hourglass. Not one grain wasted: every move was the right one.
jack.name=Lucien's Signet Ring
jack.how=Kill Lucien Vale.
jack.line=He said he was only warming up, both times. The ring is cold now, and still engraved with his crest.
queen.name=Carmilla's Mourning Brooch
queen.how=Kill Lady Carmilla Nox.
queen.line=Black jet set in silver. She wore it for everyone she outlived. It does not suit you, and you keep it anyway.
king.name=The Count's Iron Key
king.how=Kill Count Alaric Dravenmoor.
king.line=It opened the seventh step for four hundred years. It opens nothing now, and the Count has no further use for doors.
flawless.name=The Flawless Gem
flawless.how=Finish the whole Campaign without losing a hand.
flawless.line=Every vampire beaten, and not one hand lost. The stone shows no flaw, and neither did you.

; What Fenwick sells for the look of the game, and what the trophies unlock.
[style]
back.moon.name=Midnight Moon
back.moon.line=The cards as they came: wine red, gold and a crescent moon.
back.blood.name=Blood Court
back.blood.line=Deep crimson and bright gold. Fenwick says it hides stains.
back.bone.name=Bone and Ash
back.bone.line=Grey as a cold hearth, lettered in old bone.
back.midnight.name=Lucien's Midnight
back.midnight.line=Deep blue and silver, the colours he wore when he thought he was winning.
cloth.green.name=Old Green
cloth.green.line=The felt the table always had.
cloth.velvet.name=Burgundy Velvet
cloth.velvet.line=Heavy and dark, with the faint smell of an old theatre.
cloth.marble.name=Black Marble
cloth.marble.line=Cold under the hand. Cards slide on it far too well.
cloth.mourning.name=Carmilla's Mourning
cloth.mourning.line=Violet shadows. She had it laid on every table she ever lost at.
moon.pale.name=Pale Moon
moon.pale.line=The moon over the house as you first saw it.
moon.blood.name=Blood Moon
moon.blood.line=Low and red. Nobody inside will say what it means.
moon.harvest.name=Harvest Moon
moon.harvest.line=Fat, amber and almost friendly. Do not trust it.
moon.eclipse.name=The Count's Eclipse
moon.eclipse.line=A dark disc ringed in silver. He kept the night all to himself.

; Fenwick's relics: small things you keep and carry in a few slots.
[relics]
garlic.name=Garlic Wreath
garlic.line=The first bite you take in each hand costs you nothing. It only matters against Lucien.
pick.name=Locksmith's Pick
pick.line=One chained card in each hand can be taken away even with its neighbour still in the row. Made for Carmilla's chains.
spoon.name=Iron Spoon
spoon.line=The Count feeds at most once in each hand. Made for Alaric's hunger.
locket.name=Steady Locket
locket.line=Your first missed move in each hand costs nothing.
moonstone.name=Moonstone
moonstone.line=Your first Show move in each hand uses no hint card.
